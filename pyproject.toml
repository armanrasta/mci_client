[project]
name = "mci-client"
version = "0.1.0"
description = "A test client for multi-node cluster reconciliation"
readme = "README.md"
authors = [
    { name = "Arman Rostami", email = "armanrostami1382@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
mci-client = "mci_client.__main__:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mci_client"]
branch = true
omit = [
    "src/mci_client/__main__.py",
    "src/mci_client/logger.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __str__",
    "def __repr__",
    "def close",
]
show_missing = true