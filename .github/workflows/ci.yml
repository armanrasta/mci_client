name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv latest
              uses: astral-sh/setup-uv@v3
              with:
                version: "latest"
                enable-cache: true
        
            - name: Set up Python
              run: uv python install 3.14
            
            - name: Install dependencies
              run: uv sync --all-groups

            - name: Ruff check
              run: uv run ruff check src tests

            # - name: Ruff format check
            #   run: uv run ruff format --check src tests

    test:
      name: Test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
            enable-cache: true

        - name: Set up Python
          run: uv python install 3.14

        - name: Install dependencies
          run: uv sync --all-groups

        - name: Run tests with coverage
          run: uv run pytest tests/ -v --tb=short --cov=src/mci_client --cov-report=term-missing

    typecheck:
      name: Type check
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
            enable-cache: true

        - name: Set up Python
          run: uv python install 3.14

        - name: Install dependencies
          run: uv sync --all-groups

        - name: Mypy
          run: uv run mypy src
          continue-on-error: true